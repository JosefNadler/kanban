[project]
name = "pm-backend"
version = "0.1.0"
description = "FastAPI backend for project management MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118.0,<1.0.0",
  "uvicorn[standard]>=0.37.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.0.0,<3.0.0",
  "pytest>=8.4.2,<9.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
